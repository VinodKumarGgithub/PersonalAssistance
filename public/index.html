<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lara — Personal Assistant</title>
    <meta name="description" content="Lara is your AI-powered personal assistant with Google Calendar integration and web search.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a28;
            --bg-hover: #22223a;
            --surface: #16162266;
            --border: #2a2a40;
            --border-subtle: #1e1e30;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a8;
            --text-muted: #55556e;
            --accent: #7c5cfc;
            --accent-hover: #9478ff;
            --accent-glow: rgba(124, 92, 252, 0.15);
            --accent-glow-strong: rgba(124, 92, 252, 0.3);
            --user-bubble: #7c5cfc;
            --user-bubble-text: #ffffff;
            --ai-bubble: #1a1a28;
            --ai-bubble-text: #d4d4e8;
            --danger: #ff4d6a;
            --success: #34d399;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ─── Layout ───────────────────────────────── */

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 820px;
            margin: 0 auto;
            position: relative;
        }

        /* ─── Header ──────────────────────────────── */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.85);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .header-info h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-info .status {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .header-actions button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .header-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        /* ─── Chat Area ───────────────────────────── */

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* ─── Welcome Screen ──────────────────────── */

        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
            animation: fadeIn 0.6s ease-out;
        }

        .welcome-icon {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 40px var(--accent-glow-strong);
        }

        .welcome h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 380px;
            line-height: 1.5;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            max-width: 500px;
        }

        .suggestion {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 24px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(8px);
        }

        .suggestion:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* ─── Messages ────────────────────────────── */

        .message-row {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: slideUp 0.3s ease-out;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-top: 2px;
        }

        .msg-avatar.ai-avatar {
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .msg-avatar.user-avatar {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-row.user .bubble {
            background: var(--user-bubble);
            color: var(--user-bubble-text);
            border-bottom-right-radius: 6px;
        }

        .message-row.ai .bubble {
            background: var(--ai-bubble);
            color: var(--ai-bubble-text);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 6px;
        }

        /* ─── Typing Indicator ────────────────────── */

        .typing-indicator {
            display: flex;
            gap: 10px;
            align-self: flex-start;
            max-width: 85%;
            animation: slideUp 0.3s ease-out;
        }

        .typing-bubble {
            background: var(--ai-bubble);
            border: 1px solid var(--border-subtle);
            padding: 14px 20px;
            border-radius: var(--radius);
            border-bottom-left-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ─── Input Area ──────────────────────────── */

        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border-subtle);
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.85);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px 6px 6px 18px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            resize: none;
            max-height: 120px;
            padding: 8px 0;
        }

        #chat-input::placeholder {
            color: var(--text-muted);
        }

        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        #send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #send-btn svg {
            width: 18px;
            height: 18px;
        }

        .input-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ─── Animations ──────────────────────────── */

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── Responsive ──────────────────────────── */

        @media (max-width: 600px) {
            .header { padding: 12px 16px; }
            .chat-area { padding: 16px; }
            .input-area { padding: 12px 16px 20px; }
            .message-row { max-width: 92%; }
            .suggestions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- Header -->
        <header class="header" id="app-header">
            <div class="header-left">
                <div class="avatar">✦</div>
                <div class="header-info">
                    <h1>Lara</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        Online
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button id="new-chat-btn" title="Start new conversation">New Chat</button>
            </div>
        </header>

        <!-- Chat Messages -->
        <div class="chat-area" id="chat-area">
            <div class="welcome" id="welcome-screen">
                <div class="welcome-icon">✦</div>
                <h2>Hey, I'm Lara</h2>
                <p>Your personal AI assistant. I can search the web, manage your Google Calendar, and help with everyday tasks.</p>
                <div class="suggestions">
                    <button class="suggestion" data-msg="What's on my calendar this week?">📅 My calendar this week</button>
                    <button class="suggestion" data-msg="Schedule a meeting tomorrow at 10 AM for 1 hour">🗓️ Schedule a meeting</button>
                    <button class="suggestion" data-msg="Search the web for latest AI news">🔍 Latest AI news</button>
                    <button class="suggestion" data-msg="What can you help me with?">💡 What can you do?</button>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="chat-input"
                    placeholder="Message Lara..."
                    rows="1"
                    autofocus
                ></textarea>
                <button id="send-btn" title="Send message" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="input-hint">Lara can search the web & manage your calendar</div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chat-area');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        let sessionId = crypto.randomUUID();
        let isWaiting = false;

        // ─── Auto-resize textarea ──────────────────
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
            sendBtn.disabled = !chatInput.value.trim();
        });

        // ─── Send on Enter (Shift+Enter for newline) ──
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // ─── Suggestion chips ──────────────────────
        document.querySelectorAll('.suggestion').forEach(btn => {
            btn.addEventListener('click', () => {
                chatInput.value = btn.dataset.msg;
                chatInput.dispatchEvent(new Event('input'));
                sendMessage();
            });
        });

        // ─── New chat ──────────────────────────────
        newChatBtn.addEventListener('click', () => {
            sessionId = crypto.randomUUID();
            chatArea.innerHTML = '';
            chatArea.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;
            chatInput.focus();
        });

        // ─── Core send logic ───────────────────────
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isWaiting) return;

            // Hide welcome
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }

            // User message
            appendMessage(text, 'user');

            // Clear input
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Show typing
            const typingEl = showTyping();
            isWaiting = true;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, sessionId }),
                });

                const data = await res.json();
                typingEl.remove();
                appendMessage(data.message || 'Sorry, I couldn\'t process that.', 'ai');
            } catch (err) {
                typingEl.remove();
                appendMessage('Something went wrong. Please make sure the server is running.', 'ai');
            } finally {
                isWaiting = false;
                chatInput.focus();
            }
        }

        // ─── Append message ────────────────────────
        function appendMessage(text, role) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatar = document.createElement('div');
            avatar.className = `msg-avatar ${role === 'ai' ? 'ai-avatar' : 'user-avatar'}`;
            avatar.textContent = role === 'ai' ? '✦' : '•';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            row.appendChild(avatar);
            row.appendChild(bubble);
            chatArea.appendChild(row);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ─── Typing indicator ──────────────────────
        function showTyping() {
            const wrapper = document.createElement('div');
            wrapper.className = 'typing-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar ai-avatar';
            avatar.textContent = '✦';

            const bubble = document.createElement('div');
            bubble.className = 'typing-bubble';
            bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatArea.appendChild(wrapper);
            chatArea.scrollTop = chatArea.scrollHeight;
            return wrapper;
        }
    </script>
</body>
</html>
